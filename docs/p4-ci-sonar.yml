# PLANTILLA: copiar a .github/workflows/p4-ci-sonar.yml del repositorio del grupo
# Antes de activar, reemplazar TODOS los campos <<...>>. No debe ejecutarse desde esta carpeta docente.
name: P4 · Maven JUnit Cucumber JaCoCo SonarQube

on:
  push:
    branches: [main, 'p4/**']
    paths:
      - 'P4/**'
      - '.github/workflows/p4-ci-sonar.yml'
  pull_request:
    paths:
      - 'P4/**'
      - '.github/workflows/p4-ci-sonar.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: '<<RUTA_PROYECTO_MAVEN>>'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: '<<RUTA_POM>>'
      - name: Maven · compilar, JUnit, Cucumber y JaCoCo
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Publicar evidencias de prueba
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p4-test-reports
          path: |
            <<RUTA_PROYECTO_MAVEN>>/target/surefire-reports/
            <<RUTA_PROYECTO_MAVEN>>/target/site/jacoco/
            <<RUTA_PROYECTO_MAVEN>>/target/jacoco.exec
          if-no-files-found: warn

  sonarqube:
    needs: test
    # En PR externos no se exponen secretos. Verificar accesibilidad de sast.inf.um.es desde el runner.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: '<<RUTA_PROYECTO_MAVEN>>'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: '<<RUTA_POM>>'
      - name: Maven · verificar y enviar análisis a SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: '<<URL_SERVIDOR_SONARQUBE>>'
          SONAR_PROJECT_KEY: '<<CLAVE_PROYECTO_SONARQUBE>>'
        run: |
          mvn --batch-mode --no-transfer-progress clean verify
          mvn --batch-mode --no-transfer-progress org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.qualitygate.wait=true
